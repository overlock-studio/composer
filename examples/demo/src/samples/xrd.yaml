apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xdemoapps.demo.example.org
spec:
  group: demo.example.org
  names:
    kind: XDemoApp
    plural: xdemoapps
  claimNames:
    kind: DemoApp
    plural: demoapps
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  description: t-shirt size of the app
                database:
                  type: object
                  properties:
                    engine:
                      type: string
                      description: database engine to run
                    backup:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: whether backups are taken
                        retention:
                          type: integer
                          description: days a backup is kept
                    version:
                      type: string
                      description: engine version
                region:
                  type: string
                  description: region the app runs in
              required:
                - size
            status:
              type: object
              properties:
                size:
                  type: string
                  description: t-shirt size of the app
                database:
                  type: object
                  properties:
                    endpoint:
                      type: string
                      description: address the database answers on
                    ready:
                      type: boolean
                      description: whether the database is up
