name: Publish to npm

on:
  push:
    tags:
      # Any MAJOR.MINOR.PATCH (0.x.x, 1.x.x, …), and pre-releases like 1.0.0-alpha.1.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the release can find the previous tag.
          fetch-depth: 0

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.4.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a semver version"
            exit 1
          fi
          npm version "$TAG" --no-git-tag-version --allow-same-version
          # Pre-releases go out under their own dist-tag (alpha, beta, rc…), so
          # installing the package without a version never picks them up.
          if [[ "$TAG" == *-* ]]; then
            PRE="${TAG#*-}"
            DIST_TAG="${PRE%%.*}"
            if [[ "$DIST_TAG" =~ ^[0-9]+$ ]]; then DIST_TAG=next; fi
          else
            DIST_TAG=latest
          fi
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Publish to npm
        run: npm publish --tag "${{ steps.version.outputs.dist-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack build
        id: pack
        run: echo "file=$(npm pack --json | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"

      # Changelog generated by GitHub from the pull requests since the previous
      # tag, then everyone with a commit in that range (every contributor on
      # the first release), with the packed build attached.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match '[0-9]*' "$TAG^" 2>/dev/null || true)

          ARGS=(-f "tag_name=$TAG")
          if [ -n "$PREV" ]; then
            ARGS+=(-f "previous_tag_name=$PREV")
            AUTHORS=(api "repos/$REPO/compare/$PREV...$TAG" --paginate -q '.commits[].author.login // empty')
          else
            AUTHORS=(api "repos/$REPO/contributors" --paginate -q '.[].login')
          fi
          gh api "repos/$REPO/releases/generate-notes" "${ARGS[@]}" -q .body > notes.md

          {
            echo
            echo "## Contributors"
            echo
            gh "${AUTHORS[@]}" | grep -v '\[bot\]$' | sort -fu | sed 's/^/- @/'
          } >> notes.md

          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease --latest=false); fi
          gh release create "$TAG" "${{ steps.pack.outputs.file }}" \
            --title "$TAG" --notes-file notes.md "${FLAGS[@]}"
