name: Publish to npm

on:
  push:
    tags:
      # Any MAJOR.MINOR.PATCH (0.x.x, 1.x.x, …), and pre-releases like 1.0.0-alpha.1.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.4.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a semver version"
            exit 1
          fi
          npm version "$TAG" --no-git-tag-version --allow-same-version
          # Pre-releases go out under their own dist-tag (alpha, beta, rc…), so
          # installing the package without a version never picks them up.
          if [[ "$TAG" == *-* ]]; then
            PRE="${TAG#*-}"
            DIST_TAG="${PRE%%.*}"
            if [[ "$DIST_TAG" =~ ^[0-9]+$ ]]; then DIST_TAG=next; fi
          else
            DIST_TAG=latest
          fi
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Publish to npm
        run: npm publish --tag "${{ steps.version.outputs.dist-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
